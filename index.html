<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerifyHub | Secure Login</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0ea5e9',
                        dark: '#0f172a',
                    }
                }
            }
        }
    </script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .bg-login {
            background-image: url('assets/images/login_bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .overlay {
            background: linear-gradient(to right, rgba(15, 23, 42, 0.95) 0%, rgba(15, 23, 42, 0.7) 50%, rgba(15, 23, 42, 0.4) 100%);
        }
    </style>
</head>
<body class="bg-login min-h-screen flex text-white overflow-hidden">
    
    <!-- Left Section - Login Form -->
    <div class="overlay flex-1 flex flex-col justify-center items-center p-8 md:p-16 z-10 relative">
        <div class="w-full max-w-md page-enter">
            <!-- Logo area -->
            <div class="mb-10 text-center md:text-left">
                <div class="flex items-center justify-center md:justify-start gap-3 mb-2">
                    <div class="h-10 w-10 rounded-xl bg-primary flex items-center justify-center shadow-lg shadow-sky-500/50">
                        <svg class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                           <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                        </svg>
                    </div>
                    <h1 class="text-3xl font-bold tracking-wider">Verify<span class="text-primary">Hub</span></h1>
                </div>
                <p class="text-slate-400 mt-2 text-sm md:text-base">Secure Vehicle & Property Verification Portal</p>
            </div>

            <!-- Login Card -->
            <div class="glass-card rounded-2xl p-8 w-full shadow-2xl relative">
                <!-- Decorative element -->
                <div class="absolute -top-10 -right-10 w-32 h-32 bg-primary/20 rounded-full blur-3xl"></div>
                
                <h2 class="text-2xl font-semibold mb-6">Welcome Back</h2>
                
                <form onsubmit="handleLogin(event)" class="space-y-5">
                    <!-- Email Field -->
                    <div>
                        <label for="email" class="block text-sm font-medium text-slate-300 mb-1">Email / Phone</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="h-5 w-5 text-slate-400" viewBox="0 0 20 20" fill="currentColor">
                                  <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" />
                                  <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
                                </svg>
                            </div>
                            <input type="email" id="email" value="admin@verifyhub.com" class="pl-10 block w-full bg-slate-800/50 border border-slate-600 rounded-xl focus:ring-primary focus:border-primary sm:text-sm text-white py-3 transition-colors duration-200" placeholder="admin@verifyhub.com" required>
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label for="password" class="block text-sm font-medium text-slate-300">Password</label>
                            <a href="#" class="text-xs text-primary hover:text-sky-400 transition-colors">Forgot Password?</a>
                        </div>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="h-5 w-5 text-slate-400" viewBox="0 0 20 20" fill="currentColor">
                                  <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" />
                                </svg>
                            </div>
                            <input type="password" id="password" value="admin123" class="pl-10 block w-full bg-slate-800/50 border border-slate-600 rounded-xl focus:ring-primary focus:border-primary sm:text-sm text-white py-3 transition-colors duration-200" placeholder="••••••••" required>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="w-full mt-8 bg-gradient-to-r from-sky-500 to-indigo-500 hover:from-sky-400 hover:to-indigo-400 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-sky-500/30 transition-all duration-300 transform hover:-translate-y-1 btn-glow flex justify-center items-center">
                        <span id="btn-text">Secure Login</span>
                        <div id="btn-loader" class="loader hidden"></div>
                    </button>
                    
                    <p class="text-center text-sm text-slate-400 mt-4">
                        Don't have an account? <a href="#" class="text-primary hover:underline">Register</a>
                    </p>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script src="assets/js/script.js"></script>
</body>
</html>
